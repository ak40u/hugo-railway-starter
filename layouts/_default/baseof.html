<!doctype html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    {{ with .Description }}<meta name="description" content="{{ . }}" />{{ end }}
    <style>
      :root { color-scheme: light dark; --bg:#fff; --fg:#14151a; --muted:#6b7280; --accent:#7c3aed; }
      @media (prefers-color-scheme: dark) { :root { --bg:#0e0e12; --fg:#f3f4f6; --muted:#9ca3af; --accent:#a78bfa; } }
      body { margin:0; padding:3rem 1.25rem; background:var(--bg); color:var(--fg);
             font:16px/1.7 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; }
      main { max-width:38rem; margin:0 auto; }
      h1 { font-size:1.7rem; letter-spacing:-0.02em; margin:0 0 .5rem; }
      p { color:var(--muted); }
      a { color:var(--accent); }
      ul { list-style:none; padding:0; }
      li { display:flex; justify-content:space-between; gap:1rem; padding:.6rem 0; border-bottom:1px solid color-mix(in srgb, var(--fg) 12%, transparent); }
      time { color:var(--muted); font-variant-numeric:tabular-nums; }
      code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.9em;
             background:color-mix(in srgb, var(--fg) 8%, transparent); padding:.1em .4em; border-radius:4px; }
      article :is(h1,h2,h3) { margin-top:2rem; }
    </style>
  </head>
  <body>
    <main>{{ block "main" . }}{{ end }}</main>
  </body>
</html>
