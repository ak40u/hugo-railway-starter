{{ define "main" }}
<h1>{{ .Site.Title }}</h1>
<p>Your Hugo site is live. Add Markdown under <code>content/</code> and push.</p>
<ul>
  {{ range (where .Site.RegularPages "Section" "posts") }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> <time>{{ .Date.Format "2006-01-02" }}</time></li>
  {{ end }}
</ul>
{{ end }}
